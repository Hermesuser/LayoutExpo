name: CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]

jobs:
  quality:
    name: Lint, Typecheck & Full Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies & dev tooling
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[app,dev]"
          playwright install chromium

      - name: Ruff lint & format check
        run: |
          ruff check .
          ruff format --check .

      - name: Strict typecheck (mypy)
        run: mypy

      - name: Run unit, integration, and WCAG 2.2 AA E2E tests
        run: pytest -v

      - name: Dependency vulnerability audit
        run: pip-audit --skip-editable

  build-native:
    name: Build Native Package (${{ matrix.target }})
    needs: quality
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos-arm64
            os: macos-latest
            artifact_path: dist/LayoutExpo.app
          - target: macos-x86_64
            os: macos-15-intel
            artifact_path: dist/LayoutExpo.app
          - target: windows-x64
            os: windows-latest
            artifact_path: dist/LayoutExpo

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install app & build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[app,build]"

      - name: Build native bundle with PyInstaller
        run: pyinstaller --noconfirm layoutexpo.spec

      - name: Smoke check bundled app resources
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "macOS" ]; then
            ./dist/LayoutExpo.app/Contents/MacOS/LayoutExpo --check-bundle
          else
            ./dist/LayoutExpo/LayoutExpo.exe --check-bundle
          fi

      - name: Upload staging artifact
        uses: actions/upload-artifact@v4
        with:
          name: LayoutExpo-${{ matrix.target }}
          path: ${{ matrix.artifact_path }}
          retention-days: 14
